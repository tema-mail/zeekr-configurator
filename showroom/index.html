<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Шоурум Evolution Car – тестовый стенд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #050506; color: #fff; font-family: Manrope, system-ui, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; touch-action: none; }
    #stage canvas { display: block; }
    header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 20px; padding: 20px 32px; z-index: 2; pointer-events: none;
      background: linear-gradient(rgba(5,5,6,.65), rgba(5,5,6,0)); }
    header img { height: 44px; margin: -12px; }
    header span { font-size: 13px; opacity: .7; margin-left: 12px; }
    .panel { position: fixed; left: 32px; bottom: 32px; width: min(420px, calc(100vw - 32px)); z-index: 2; transition: opacity .25s, transform .25s; }
    .panel[hidden] { display: block; opacity: 0; transform: translateY(10px); pointer-events: none; }
    #hero { width: min(620px, calc(100vw - 32px)); }
    #hero h1 { margin: 0 0 10px; font-size: clamp(30px, min(3.4vw, 6vh), 52px); line-height: 1; font-weight: 800; letter-spacing: -.02em; }
    #hero h1 em { font-style: normal; color: #5fd4c9; }
    #hero h2 { margin: 0 0 12px; font-size: clamp(18px, 1.7vw, 24px); font-weight: 600; }
    #hero p { margin: 0; font-size: 15px; line-height: 1.5; opacity: .75; max-width: 420px; }
    #card { padding: 20px; border-radius: 16px; background: rgba(14,15,18,.86); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.08); }
    #card small { font-size: 12px; opacity: .55; }
    #card h2 { margin: 4px 0 2px; font-size: 26px; font-weight: 800; }
    #card .color { font-size: 14px; opacity: .75; }
    #card dl { display: flex; gap: 20px; margin: 14px 0 16px; }
    #card dt { font-size: 15px; font-weight: 700; white-space: nowrap; }
    #card dd { margin: 2px 0 0; font-size: 11px; opacity: .55; }
    #card dl div:first-child dt { color: #fff; }
    #card .tip { margin: 0 0 12px; font-size: 12px; opacity: .6; }
    #open { width: 100%; padding: 13px 18px; border: 0; border-radius: 999px; background: #0b4442; color: #fff; box-shadow: inset 0 0 0 1px #5fd4c9; font: 700 14px Manrope, sans-serif; cursor: pointer; }
    #loader { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #050506; transition: opacity .6s; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader img { width: min(420px, 70vw); margin: -20px 0; }
    #loader .row { width: min(360px, 70vw); display: flex; justify-content: space-between; font-size: 13px; opacity: .8; }
    #loader .track { width: min(360px, 70vw); height: 4px; border-radius: 4px; background: #1c1d20; overflow: hidden; }
    #bar { width: 0; height: 100%; background: linear-gradient(90deg, #0b4442, #5fd4c9); transition: width .2s; }
    @media (max-width: 700px) { header { padding: 16px; } header span { display: none; } .panel { left: 16px; bottom: 16px; } }
    #fade { position: fixed; inset: 0; z-index: 6; background: #f4f5f7; opacity: 0; pointer-events: none; transition: opacity .45s; }
    #fade.on { opacity: 1; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <header><img src="../assets/stage/logo.png" alt="Evolution Car"><span>Шоурум · тестовый стенд</span></header>
  <section id="hero" class="panel">
    <h1>Твой Zeekr 8X<br><em>ждёт тебя</em></h1>
    <h2>Осталось собрать его под себя</h2>
    <p>Нажми на машину и попадёшь в конфигуратор. Ряд двигается колёсиком или мышкой.</p>
  </section>
  <section id="card" class="panel" hidden>
    <small id="bay"></small>
    <h2 id="car-name"></h2>
    <div class="color" id="car-color"></div>
    <dl id="specs"></dl>
    <p class="tip">Потяни, чтобы покрутить. Нажми на машину, и она выедет к тебе в конфигуратор.</p>
    <button id="open" type="button">Собрать эту машину</button>
  </section>
  <div id="loader">
    <img src="../assets/stage/logo.png" alt="Evolution Car">
    <div class="row"><span>Открываем ворота</span><b id="pct">0%</b></div>
    <div class="track"><div id="bar"></div></div>
  </div>
  <div id="fade"></div>
  <script type="module" src="../js/showroom.js"></script>
</body>
</html>
